<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Paro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #242A39;
    --bg-bottom: #20242F;
    --pipe: #93D047;
    --pipe-dark: #6f9e33;
    --pipe-light: #b3e06c;
    --ground: #4A5164;
    --ground-dark: #3a3f4e;
    --dot: #FFA42D;
    --text: #FFFFFF;
    --panel-bg: rgba(32,36,47,0.95);
    --panel-text: #FFFFFF;
    --accent: #FFA42D;
    --accent-text: #20242F;
    --hex-line: rgba(147,211,71,0.18);
    --cloud-color: rgba(255,255,255,0.16);
  }
  :root[data-theme="light"] {
    --bg-top: #cfe8b0;
    --bg-bottom: #eef3d8;
    --pipe: #93D047;
    --pipe-dark: #6f9e33;
    --pipe-light: #b3e06c;
    --ground: #d9c98a;
    --ground-dark: #c2b26f;
    --dot: #FFA42D;
    --text: #20242F;
    --panel-bg: rgba(255,255,255,0.95);
    --panel-text: #20242F;
    --accent: #FFA42D;
    --accent-text: #20242F;
    --hex-line: rgba(147,211,71,0.28);
    --cloud-color: rgba(255,255,255,0.55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(120deg, #242A39, #FFA42D, #93D047, #20242F, #FFA42D, #242A39);
    background-size: 400% 400%;
    animation: paroGradientCycle 18s ease infinite;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  @keyframes paroGradientCycle {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    html, body { animation: none; background-position: 0% 50%; }
  }
  button, canvas, div { -webkit-tap-highlight-color: transparent; outline: none; }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    position: relative;
  }
  #shakeBox {
    position: relative;
    display: inline-block;
  }
  #gameCanvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    touch-action: manipulation;
    cursor: pointer;
  }
  #flashOverlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(220,40,40,0);
    pointer-events: none;
    transition: background 0.08s ease-out;
  }
  #hud {
    position: absolute;
    top: 5%;
    left: 50%;
    transform: translateX(-50%) scale(1);
    font-family: "Lora", Georgia, serif;
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 2px rgba(0,0,0,0.6);
    pointer-events: none;
    user-select: none;
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  #hud.pop { transform: translateX(-50%) scale(1.35); }
  #panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--panel-bg);
    color: var(--panel-text);
    padding: 28px 32px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    max-width: 90%;
    display: none;
  }
  #badge {
    width: 64px;
    height: 56px;
    margin: 0 auto 10px auto;
    background: #FFFFFF;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 4px var(--pipe) inset;
  }
  #badge img {
    width: 68%;
    height: 68%;
    object-fit: contain;
  }
  #panel h1 {
    margin: 0 0 8px 0;
    font-family: "Lora", Georgia, serif;
    font-weight: 700;
    font-size: clamp(20px, 5vw, 28px);
    color: var(--accent);
  }
  #panel p {
    margin: 4px 0;
    font-family: "Poppins", -apple-system, sans-serif;
    font-weight: 400;
    opacity: 0.85;
    font-size: 14px;
  }
  #panel .score-line {
    font-family: "Poppins", -apple-system, sans-serif;
    font-size: clamp(16px, 4vw, 20px);
    margin: 12px 0;
    font-weight: 600;
  }
  #startBtn {
    margin-top: 14px;
    padding: 12px 28px;
    font-family: "Poppins", -apple-system, sans-serif;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #startBtn:active { transform: scale(0.97); }
  #hint {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: var(--text);
    font-family: "Poppins", -apple-system, sans-serif;
    font-size: 14px;
    opacity: 0.85;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    pointer-events: none;
    user-select: none;
  }
  #brandLockup {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    user-select: none;
    z-index: 5;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  #brandLockup img.icon {
    height: 30px;
    width: auto;
    display: block;
  }
  #brandLockup img.wordmark {
    height: 20px;
    width: auto;
    display: block;
  }
</style>
</head>

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panelTitle');
  const panelSub = document.getElementById('panelSub');
  const scoreLine = document.getElementById('scoreLine');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');
  const shakeBox = document.getElementById('shakeBox');
  const flashOverlay = document.getElementById('flashOverlay');

  const GW = 400, GH = 600;
  canvas.width = GW;
  canvas.height = GH;

  function resize() {
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    const scale = Math.min(availW / GW, availH / GH, 1.4);
    canvas.style.width = (GW * scale) + 'px';
    canvas.style.height = (GH * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const imgA = new Image();
  const imgB = new Image();
  let readyA = false, readyB = false;
  let aspectA = 528/432, aspectB = 433/426;
  imgA.onload = () => { readyA = true; aspectA = imgA.naturalWidth / imgA.naturalHeight; };
  imgB.onload = () => { readyB = true; aspectB = imgB.naturalWidth / imgB.naturalHeight; };
  imgA.src = BIRD_A_SRC;
  imgB.src = BIRD_B_SRC;

  const BIRD_W = 46;

  const GRAVITY = 1500;
  const FLAP_VELOCITY = -430;
  const PIPE_GAP = 165;
  const PIPE_WIDTH = 62;
  const PIPE_SPEED = 165;
  const PIPE_INTERVAL = 1400;
  const FLAP_ANIM_MS = 320;
  const FEATHER_CAP = 45;

  let state = 'ready';
  let bird, pipes, score, best, lastTime, pipeTimer, groundOffset;
  let particles = [];
  let trailEmitAccum = 0;
  let hexagons = [];
  let hexOffset = 0;
  let shakeTime = 0, shakeMag = 0;
  let ambientFeathers = [];
  let featherSpawnAccum = 0;

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  function loadBest() {
    try {
      const v = localStorage.getItem('flappyParoBest');
      return v ? parseInt(v, 10) : 0;
    } catch(e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('flappyParoBest', String(v)); } catch(e) {}
  }
  best = loadBest();

  function initClouds() {
    hexagons = [];
    const count = 9;
    for (let i = 0; i < count; i++) {
      hexagons.push({
        x: (i / count) * GW * 2.2 + (i % 3) * 40,
        y: 40 + (i * 53) % (GH - 160),
        size: 30 + (i % 4) * 14,
        speed: 0.55 + (i % 3) * 0.15
      });
    }
  }
  initClouds();

  function reset() {
    const h = BIRD_W / aspectA;
    bird = { x: GW * 0.28, y: GH / 2, vy: 0, w: BIRD_W, h: h, rot: 0, flapTimer: 0 };
    pipes = [];
    particles = [];
    trailEmitAccum = 0;
    score = 0;
    pipeTimer = 0;
    groundOffset = 0;
    hexOffset = 0;
    shakeTime = 0;
    hud.textContent = '0';
  }
  reset();

  function spawnPipe() {
    const groundY = GH - 40;
    const corner = 10;
    const topLimit = corner + PIPE_GAP / 2;
    const botLimit = groundY - corner - PIPE_GAP / 2;
    const gapCenter = topLimit + Math.random() * Math.max(0, botLimit - topLimit);
    const leaves = [];
    const leafCount = 4 + Math.floor(Math.random() * 2);
    for (let i = 0; i < leafCount; i++) {
      leaves.push({
        relY: (i + 0.5) / leafCount + (Math.random() - 0.5) * 0.08,
        side: i % 2 === 0 ? 1 : -1,
        r: 0.34 + Math.random() * 0.12,
        tone: Math.random() < 0.5 ? 0 : 1
      });
    }
    const vineSeed = Math.random() * Math.PI * 2;
    pipes.push({ x: GW + PIPE_WIDTH, gapCenter: gapCenter, passed: false, leaves: leaves, vineSeed: vineSeed });
  }

  function spawnFeather() {
    const colors = ['#93D047', '#FFA42D', '#b3e06c', '#ffbf5c'];
    ambientFeathers.push({
      x: Math.random() * GW,
      y: -20,
      vy: 18 + Math.random() * 14,
      swayAmp: 14 + Math.random() * 18,
      swaySpeed: 0.6 + Math.random() * 0.6,
      swayPhase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 1.2,
      size: 9 + Math.random() * 7,
      color: colors[Math.floor(Math.random() * colors.length)],
      age: 0,
      maxAge: 30
    });
  }

  function spawnParticles() {
    particles.push({
      x: bird.x - bird.w * 0.35,
      y: bird.y + (Math.random() - 0.5) * bird.h * 0.25,
      vx: -100 - Math.random() * 40,
      vy: (Math.random() - 0.5) * 15,
      life: 0.75,
      maxLife: 0.75,
      r: 3 + Math.random() * 2
    });
  }

  function popScore() {
    hud.classList.remove('pop');
    void hud.offsetWidth;
    hud.classList.add('pop');
  }

  function triggerShake(mag) {
    shakeTime = 0.25;
    shakeMag = mag;
  }

  function triggerFlash() {
    flashOverlay.style.background = 'rgba(220,40,40,0.55)';
    requestAnimationFrame(() => {
      flashOverlay.style.background = 'rgba(220,40,40,0)';
    });
  }

  function flap() {
    if (state === 'ready') { startGame(); return; }
    if (state === 'dead') return;
    bird.vy = FLAP_VELOCITY;
    bird.flapTimer = FLAP_ANIM_MS;
  }

  function startGame() {
    reset();
    state = 'playing';
    panel.style.display = 'none';
    hint.style.display = 'block';
    bird.vy = FLAP_VELOCITY;
    bird.flapTimer = FLAP_ANIM_MS;
  }

  function die() {
    if (state !== 'playing') return;
    state = 'dead';
    triggerShake(6);
    triggerFlash();
    if (score > best) { best = score; saveBest(best); }
    panelTitle.textContent = 'Nice try!';
    panelSub.textContent = 'Tap Restart to try again';
    scoreLine.style.display = 'block';
    scoreLine.textContent = 'Score: ' + score + '   Best: ' + best;
    startBtn.textContent = 'Restart';
    setTimeout(() => { panel.style.display = 'block'; }, 180);
    hint.style.display = 'none';
  }

  function showReadyPanel() {
    panelTitle.textContent = 'Flappy Paro';
    panelSub.textContent = 'Tap, click, or press space to flap';
    scoreLine.style.display = 'none';
    startBtn.textContent = 'Start';
    panel.style.display = 'block';
    hint.style.display = 'none';
  }
  showReadyPanel();

  startBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); startGame(); });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });

  function update(dt) {
    hexOffset -= PIPE_SPEED * 0.35 * dt;

    if (shakeTime > 0) {
      shakeTime -= dt;
      const mag = shakeMag * (shakeTime / 0.25);
      const dx = (Math.random() - 0.5) * mag;
      const dy = (Math.random() - 0.5) * mag;
      shakeBox.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
      if (shakeTime <= 0) shakeBox.style.transform = 'translate(0,0)';
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }

    const featherTarget = Math.min(score, FEATHER_CAP);
    featherSpawnAccum += dt * 1000;
    if (ambientFeathers.length < featherTarget && featherSpawnAccum >= 130) {
      featherSpawnAccum = 0;
      spawnFeather();
    }
    for (let i = ambientFeathers.length - 1; i >= 0; i--) {
      const f = ambientFeathers[i];
      f.age += dt;
      f.y += f.vy * dt;
      f.x += Math.sin(f.age * f.swaySpeed + f.swayPhase) * f.swayAmp * dt;
      f.rot += f.rotSpeed * dt;
      if (f.y > GH + 30 || f.age > f.maxAge) {
        ambientFeathers.splice(i, 1);
      }
    }

    if (state !== 'playing') return;

    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 600));

    if (bird.flapTimer > 0) {
      bird.flapTimer -= dt * 1000;
      if (bird.flapTimer < 0) bird.flapTimer = 0;
      trailEmitAccum += dt * 1000;
      const emitInterval = 16;
      while (trailEmitAccum >= emitInterval) {
        spawnParticles();
        trailEmitAccum -= emitInterval;
      }
    } else {
      trailEmitAccum = 0;
    }

    groundOffset -= PIPE_SPEED * dt;

    pipeTimer += dt * 1000;
    if (pipeTimer >= PIPE_INTERVAL) { pipeTimer = 0; spawnPipe(); }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;
      if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
        p.passed = true;
        score++;
        hud.textContent = String(score);
        popScore();
      }
      if (p.x < -PIPE_WIDTH) pipes.splice(i, 1);
    }

    const bx = bird.x - bird.w / 2 + 6;
    const by = bird.y - bird.h / 2 + 6;
    const bw = bird.w - 12;
    const bh = bird.h - 12;

    if (bird.y - bird.h/2 <= 0 || bird.y + bird.h/2 >= GH - 40) { die(); return; }

    for (const p of pipes) {
      const topH = p.gapCenter - PIPE_GAP / 2;
      const botY = p.gapCenter + PIPE_GAP / 2;
      if (bx + bw > p.x && bx < p.x + PIPE_WIDTH) {
        if (by < topH || by + bh > botY) { die(); return; }
      }
    }
  }

  function drawCloud(cx, cy, size) {
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 1.4);
    grad.addColorStop(0, cssVar('--cloud-color', 'rgba(255,255,255,0.35)'));
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx, cy, size * 1.3, size * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    ctx.clearRect(0, 0, GW, GH);
    const wrapW = GW * 2.2 + 200;
    for (const hx of hexagons) {
      let x = hx.x + hexOffset * hx.speed;
      x = ((x % wrapW) + wrapW) % wrapW - 100;
      drawCloud(x, hx.y, hx.size);
    }
  }

  function drawFloorLeaf(baseX, baseY, angle, length, width, leafColor, stemColor) {
    const stemLen = length * 0.3;
    const stemX = baseX + Math.cos(angle) * stemLen;
    const stemY = baseY + Math.sin(angle) * stemLen;
    ctx.strokeStyle = stemColor;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    ctx.lineTo(stemX, stemY);
    ctx.stroke();

    ctx.fillStyle = leafColor;
    ctx.save();
    ctx.translate(stemX, stemY);
    ctx.rotate(angle);
    const L = length * 0.7;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L * 0.35, -width, L, 0);
    ctx.quadraticCurveTo(L * 0.35, width, 0, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(L, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawVineStrand(yBase, amplitude, freq, phaseSeed, speedMult, spacing, leafColor, stemColor, leafSide) {
    ctx.strokeStyle = stemColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const step = 9;
    let started = false;
    for (let x = -step; x <= GW + step; x += step) {
      const y = yBase + Math.sin((x - groundOffset * speedMult) * freq + phaseSeed) * amplitude;
      if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
    }
    ctx.stroke();

    const scrollX = groundOffset * speedMult;
    let startX = (((scrollX % spacing) + spacing) % spacing) - spacing;
    for (let x = startX - spacing; x <= GW + spacing; x += spacing) {
      const worldPhase = (x - scrollX) * freq + phaseSeed;
      const y = yBase + Math.sin(worldPhase) * amplitude;
      const slope = Math.cos(worldPhase) * amplitude * freq;
      const tangentAngle = Math.atan2(slope, 1);
      const outAngle = tangentAngle + (leafSide * Math.PI) / 2;
      drawFloorLeaf(x, y, outAngle, 15, 5, leafColor, stemColor);
    }
  }

  function drawGround() {
    const groundY = GH - 40;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, groundY - 10, GW, 50);
    ctx.clip();

    ctx.fillStyle = cssVar('--pipe-dark', '#6f9e33');
    ctx.fillRect(0, groundY, GW, 40);

    const pipeColor = cssVar('--pipe', '#93D047');
    const pipeLight = cssVar('--pipe-light', '#b3e06c');
    const pipeDark = cssVar('--pipe-dark', '#6f9e33');

    drawVineStrand(groundY + 6, 4, 0.05, 0.4, 1.0, 26, pipeLight, pipeColor, 1);
    drawVineStrand(groundY + 15, 5, 0.045, 2.1, 0.9, 30, pipeColor, pipeDark, -1);
    drawVineStrand(groundY + 24, 4, 0.055, 4.0, 0.8, 24, pipeDark, pipeColor, 1);
    drawVineStrand(groundY + 33, 3, 0.05, 1.2, 0.95, 28, pipeLight, pipeDark, -1);

    ctx.restore();
  }

  function roundRectPath(x, y, w, h, r) {
    w = Math.max(0, w);
    h = Math.max(0, h);
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.arcTo(x + w, y, x + w, y + rr, rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
    ctx.lineTo(x + rr, y + h);
    ctx.arcTo(x, y + h, x, y + h - rr, rr);
    ctx.lineTo(x, y + rr);
    ctx.arcTo(x, y, x + rr, y, rr);
    ctx.closePath();
  }

  function drawVine(leaves, x, yStart, height, seed) {
    if (height <= 4 || !leaves) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, yStart, PIPE_WIDTH, height);
    ctx.clip();

    const vineColor = cssVar('--pipe-light', '#b3e06c');
    const leafColor = cssVar('--pipe', '#93D047');
    const centerX = x + PIPE_WIDTH / 2;
    const amplitude = PIPE_WIDTH * 0.26;
    const turns = Math.max(1.5, height / 90);

    function vineX(t) {
      return centerX + Math.sin(t * Math.PI * 2 * turns + seed) * amplitude;
    }

    // the vine stem, spiraling around the trunk
    ctx.strokeStyle = vineColor;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const steps = Math.max(8, Math.floor(height / 6));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const yy = yStart + t * height;
      const xx = vineX(t);
      if (i === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
    }
    ctx.stroke();

    // leaves attached along the vine on short stems, pointing outward
    for (const lf of leaves) {
      const t = Math.max(0, Math.min(1, lf.relY));
      const yy = yStart + t * height;
      const vx = vineX(t);
      const tangentSlope = Math.cos(t * Math.PI * 2 * turns + seed);
      // outward direction, roughly perpendicular to the vine's local direction
      const dirX = lf.side * (1 - Math.abs(tangentSlope) * 0.3);
      const dirLen = Math.hypot(dirX, 0.35) || 1;
      const nx = dirX / dirLen;
      const ny = 0.35 / dirLen;

      const leafLen = lf.r * PIPE_WIDTH * 1.8;
      const leafW = leafLen * 0.42;
      const stemLen = leafLen * 0.35;

      const baseX = vx + nx * stemLen;
      const baseY = yy + ny * stemLen * 0.4;
      const tipX = vx + nx * (stemLen + leafLen);
      const tipY = yy + ny * (stemLen + leafLen) * 0.4;

      // stem
      ctx.strokeStyle = vineColor;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(vx, yy);
      ctx.lineTo(baseX, baseY);
      ctx.stroke();

      // leaf blade: pointed teardrop from base to tip
      const angle = Math.atan2(tipY - baseY, tipX - baseX);
      ctx.fillStyle = lf.tone === 0 ? leafColor : vineColor;
      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.rotate(angle);
      const L = Math.hypot(tipX - baseX, tipY - baseY);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L * 0.35, -leafW, L, 0);
      ctx.quadraticCurveTo(L * 0.35, leafW, 0, 0);
      ctx.fill();
      // center vein
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(L, 0);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPipe(p) {
    const topH = p.gapCenter - PIPE_GAP / 2;
    const botY = p.gapCenter + PIPE_GAP / 2;
    const groundY = GH - 40;
    const pipeDark = cssVar('--pipe-dark', '#6f9e33');

    // top branch
    ctx.fillStyle = pipeDark;
    roundRectPath(p.x, -10, PIPE_WIDTH, topH + 10, 14);
    ctx.fill();
    drawVine(p.leaves, p.x, 0, topH, p.vineSeed);

    // bottom branch
    ctx.fillStyle = pipeDark;
    roundRectPath(p.x, botY, PIPE_WIDTH, (groundY - botY) + 10, 14);
    ctx.fill();
    drawVine(p.leaves, p.x, botY, groundY - botY, p.vineSeed);
  }

  function drawParticles() {
    ctx.save();
    ctx.shadowColor = 'rgba(255,164,45,0.85)';
    ctx.shadowBlur = 6;
    for (const pt of particles) {
      const t = Math.max(0, pt.life / pt.maxLife);
      const alpha = t * 0.85;
      const len = 4 + (1 - t) * 10;
      ctx.strokeStyle = 'rgba(255,180,60,' + alpha.toFixed(2) + ')';
      ctx.lineWidth = pt.r * Math.max(0.25, t);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y);
      ctx.lineTo(pt.x + len, pt.y - pt.vy * 0.02);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot * 0.6);

    if (readyA && readyB) {
      const blend = Math.max(0, Math.min(1, bird.flapTimer / FLAP_ANIM_MS));
      const h = bird.w / aspectB;
      // Frame B's artwork has the eye at a slightly different position than
      // frame A. Shift frame B by that offset so the eyes coincide during
      // the cross-fade instead of appearing to double up.
      const eyeOffsetX = 0.0779 * bird.w;
      const eyeOffsetY = 0.0214 * h;
      if (blend < 1) {
        ctx.globalAlpha = 1 - blend;
        ctx.drawImage(imgA, -bird.w/2, -bird.h/2, bird.w, bird.h);
        ctx.globalAlpha = 1;
      }
      if (blend > 0) {
        ctx.globalAlpha = blend;
        ctx.drawImage(imgB, -bird.w/2 + eyeOffsetX, -h/2 + eyeOffsetY, bird.w, h);
        ctx.globalAlpha = 1;
      }
    } else if (readyA) {
      ctx.drawImage(imgA, -bird.w/2, -bird.h/2, bird.w, bird.h);
    } else {
      ctx.fillStyle = '#FFA42D';
      ctx.beginPath();
      ctx.arc(0, 0, bird.w/2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFeathers() {
    for (const f of ambientFeathers) {
      const fadeIn = Math.min(1, f.age / 0.6);
      const fadeOut = Math.min(1, (f.maxAge - f.age) / 2);
      const alpha = Math.max(0, Math.min(fadeIn, fadeOut)) * 0.35;
      if (alpha <= 0) continue;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.moveTo(0, -f.size);
      ctx.quadraticCurveTo(f.size * 0.6, -f.size * 0.3, 0, f.size);
      ctx.quadraticCurveTo(-f.size * 0.6, -f.size * 0.3, 0, -f.size);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(0, -f.size);
      ctx.lineTo(0, f.size);
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    drawBackground();
    drawFeathers();
    drawParticles();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();
  }

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.035);
    lastTime = ts;
    try {
      update(dt);
      draw();
    } catch (err) {
      console.error('Flappy Paro frame error (recovered):', err);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
